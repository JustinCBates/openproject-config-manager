flow_id: "storage_configuration"
title: "Storage & Backup Configuration"
description: "Configure data storage, volumes, and backup settings"
icon: "💾"

steps:
  - id: "data_volume_type"
    type: "select"
    message: "Data storage type:"
    choices:
      - "Docker volumes (recommended)"
      - "Host directory"
      - "Custom configuration"
    default: "Docker volumes (recommended)"
    instruction: "Docker volumes are managed by Docker and easier to backup"
    
  - id: "data_volume_name"
    type: "text"
    message: "Data volume name:"
    when: "data_volume_type == 'Docker volumes (recommended)'"
    default: "openproject_data"
    instruction: "Name for the Docker data volume"
    
  - id: "data_host_path"
    type: "text"
    message: "Host directory path:"
    when: "data_volume_type == 'Host directory'"
    default: "/var/openproject/data"
    instruction: "Absolute path on host filesystem"
    
  - id: "logs_volume_name"
    type: "text"
    message: "Logs volume name:"
    default: "openproject_logs"
    instruction: "Name for the Docker logs volume"
    
  - id: "backup_enabled"
    type: "confirm"
    message: "Enable automated backups?"
    default: true
    instruction: "Highly recommended for production"
    
  - id: "backup_schedule"
    type: "text"
    message: "Backup schedule (cron format):"
    when: "backup_enabled == true"
    default: "0 2 * * *"
    instruction: "Daily at 2 AM (0 2 * * *)"
    
  - id: "backup_retention_days"
    type: "text"
    message: "Backup retention (days):"
    when: "backup_enabled == true"
    default: "30"
    instruction: "Number of days to keep backups"
    
  - id: "backup_location"
    type: "select"
    message: "Backup storage location:"
    when: "backup_enabled == true"
    choices:
      - "Local directory"
      - "Remote server (rsync)"
      - "Cloud storage (S3)"
      - "Custom script"
    default: "Local directory"
    instruction: "Choose backup destination"
    
  - id: "backup_local_path"
    type: "text"
    message: "Local backup directory:"
    when: "backup_enabled == true and backup_location == 'Local directory'"
    default: "./backups"
    instruction: "Directory to store backup files"

output_mapping:
  data_volume_type: "storage.data_volume_type"
  data_volume_name: "storage.data_volume"
  data_host_path: "storage.data_host_path"
  logs_volume_name: "storage.logs_volume"
  backup_enabled: "storage.backup_enabled"
  backup_schedule: "storage.backup_schedule"
  backup_retention_days: "storage.backup_retention_days"
  backup_location: "storage.backup_location"
  backup_local_path: "storage.backup_location_path"