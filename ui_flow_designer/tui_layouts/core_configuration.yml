flow_id: "core_configuration"
title: "Core OpenProject Settings"
description: "Configure basic OpenProject application settings"
icon: "⚙️"

steps:
  - id: "secret_key_generation"
    type: "confirm"
    message: "Generate a new secret key for OpenProject?"
    default: true
    instruction: "Required for session security and encryption"
    
  - id: "rails_env"
    type: "select"
    message: "Select Rails environment:"
    choices:
      - "production"
      - "development" 
      - "staging"
    default: "production"
    instruction: "Production for live deployments, development for testing"
    
  - id: "rails_cache_store"
    type: "select"
    message: "Select cache store:"
    choices:
      - "memcache"
      - "redis"
      - "file_store"
    default: "memcache"
    instruction: "memcache recommended for production, file_store for development"

output_mapping:
  secret_key_generation: "secret_key_generation"
  rails_env: "rails_env"
  rails_cache_store: "rails_cache_store"