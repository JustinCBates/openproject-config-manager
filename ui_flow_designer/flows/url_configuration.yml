flow_id: "url_configuration"
title: "URL Configuration"
description: "Configure how OpenProject URLs will be structured"
icon: "🌐"

steps:
  - id: "hosting_type"
    type: "select"
    message: "How will OpenProject be accessed?"
    choices:
      - "🌐 Root domain (https://openproject.company.com)"
      - "📁 Subdirectory (https://company.com/openproject)"
      - "🔧 Advanced configuration"
    default: "🌐 Root domain (https://openproject.company.com)"
    instruction: "Choose based on your hosting setup"
    
  - id: "uri_namespace_enabled"
    type: "computed"
    compute: "hosting_type == '📁 Subdirectory (https://company.com/openproject)'"
    
  - id: "uri_namespace"
    type: "text"
    message: "Enter the subdirectory path:"
    when: "uri_namespace_enabled == true"
    default: "/openproject"
    validate: "namespace_path"
    instruction: "(e.g., /openproject, /projects, /my-company)"
    preview: "Final URL: https://{proxy.domain}{uri_namespace}"
    
  - id: "confirm_url_config"
    type: "confirm"
    message: "Does this URL configuration look correct?"
    when: "uri_namespace_enabled == true"
    default: true

output_mapping:
  uri_namespace_enabled: "uri_namespace_enabled"
  uri_namespace: "uri_namespace"
  hosting_type: "hosting_type"