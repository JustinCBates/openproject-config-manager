flow_id: "proxy_configuration"
title: "Proxy & SSL Configuration"
description: "Configure reverse proxy, SSL, and security settings"
icon: "🔒"

steps:
  - id: "primary_domain"
    type: "text"
    message: "Primary domain name:"
    default: "openproject.local"
    validate: "domain"
    instruction: "Domain where OpenProject will be accessible"
    
  - id: "add_additional_domains"
    type: "confirm"
    message: "Add additional domains?"
    default: false
    instruction: "Multiple domains for the same OpenProject instance"
    
  - id: "additional_domains"
    type: "text"
    message: "Additional domains (comma-separated):"
    when: "add_additional_domains == true"
    instruction: "e.g., openproject.company.com, op.company.com"
    
  - id: "ssl_enabled"
    type: "confirm"
    message: "Enable SSL/TLS?"
    default: true
    instruction: "Highly recommended for production"
    
  - id: "ssl_mode"
    type: "select"
    message: "SSL certificate mode:"
    when: "ssl_enabled == true"
    choices:
      - "Let's Encrypt (automatic)"
      - "Let's Encrypt Staging (testing)"
      - "Custom certificate"
      - "Self-signed (development only)"
    default: "Let's Encrypt (automatic)"
    instruction: "Let's Encrypt provides free SSL certificates"
    
  - id: "letsencrypt_email"
    type: "text"
    message: "Email for Let's Encrypt notifications:"
    when: "ssl_mode == 'Let\\'s Encrypt (automatic)' or ssl_mode == 'Let\\'s Encrypt Staging (testing)'"
    instruction: "Required for certificate renewal notifications"
    
  - id: "ssl_cert_path"
    type: "text"
    message: "SSL certificate file path:"
    when: "ssl_mode == 'Custom certificate'"
    instruction: "Path to your SSL certificate file"
    
  - id: "ssl_key_path"
    type: "text"
    message: "SSL private key file path:"
    when: "ssl_mode == 'Custom certificate'"
    instruction: "Path to your SSL private key file"
    
  - id: "reverse_proxy_enabled"
    type: "confirm"
    message: "Enable reverse proxy?"
    default: true
    instruction: "Recommended for production deployments"

output_mapping:
  primary_domain: "proxy.domain"
  additional_domains: "proxy.additional_domains"
  ssl_enabled: "proxy.ssl_enabled"
  ssl_mode: "proxy.ssl_mode"
  letsencrypt_email: "proxy.lets_encrypt_email"
  ssl_cert_path: "proxy.ssl_cert_path"
  ssl_key_path: "proxy.ssl_key_path"
  reverse_proxy_enabled: "proxy.reverse_proxy_enabled"