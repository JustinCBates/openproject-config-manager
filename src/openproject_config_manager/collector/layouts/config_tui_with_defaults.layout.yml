title: OpenProject Configuration Wizard
description: Comprehensive setup wizard for OpenProject deployment  
icon: 🏗️
version: "1.0.0"

metadata:
  id: config_tui.layout
  author: "OpenProject Config Manager"
  category: "deployment"
  tags: ["openproject", "configuration", "deployment", "docker"]
  estimated_time: "15 minutes"
  
  # Explicit defaults file specification
  defaults_file: "config_TUI.defaults.yml"

steps:
  # Welcome and Project Basics
  - id: welcome
    type: info
    title: "Welcome to OpenProject Setup"
    message: |
      This wizard will guide you through configuring your OpenProject instance.
      
      We'll collect information about:
      • Project settings and admin account
      • Database configuration  
      • Network and domain setup
      • Email delivery settings
      • Storage and repository options
      • Resource allocation
      
      All settings can be changed later if needed.
    instruction: "Press Enter to continue"

  - id: project_name
    type: text
    message: "Project name:"
    instruction: "Used for container names, volumes, and internal references"
    validate: required
    default: "openproject"
    pattern: "^[a-zA-Z][a-zA-Z0-9_-]*$"
    error_message: "Must start with letter, contain only letters, numbers, underscores, and hyphens"

  - id: admin_email
    type: text
    message: "Administrator email address:"
    instruction: "Email for the primary OpenProject administrator account"
    validate: email
    error_message: "Please enter a valid email address"

  - id: admin_password
    type: password
    message: "Administrator password:"
    instruction: "Strong password for the admin account (min 8 characters)"
    validate: password_length
    min_length: 8

  # Environment Configuration
  - id: environment_type
    type: select
    message: "Deployment environment:"
    instruction: "This affects default security and performance settings"
    choices:
      - "Development (Local testing)"
      - "Staging (Pre-production testing)"
      - "Production (Live deployment)"
    default: "Development (Local testing)"

  # Database Configuration
  - id: database_type
    type: select
    message: "Database type:"
    instruction: "PostgreSQL is recommended for production use"
    choices:
      - name: "PostgreSQL (Recommended)"
        value: "postgresql"
      - name: "MySQL/MariaDB"
        value: "mysql"
    default: "postgresql"

  - id: database_setup
    type: select
    message: "Database setup:"
    instruction: "Choose how to handle the database"
    choices:
      - name: "Create new database container (Recommended)"
        value: "container"
      - name: "Use existing external database"
        value: "external"
    default: "container"

  # Database Port with Dynamic Defaults
  - id: database_port
    type: text
    message: "Database port:"
    instruction: "Port number for database connection"
    validate: integer
    condition: "database_setup == 'external'"
    # Static fallback
    default: "5432"
    # Dynamic defaults based on database type selection
    dynamic_defaults:
      - condition: "database_type == 'postgresql'"
        value: "5432"
        reason: "Standard PostgreSQL port"
      - condition: "database_type == 'mysql'"
        value: "3306"
        reason: "Standard MySQL port"

  # Domain Configuration
  - id: domain_name
    type: text
    message: "Domain name:"
    instruction: "Domain where OpenProject will be accessible (e.g., openproject.example.com)"
    validate: domain
    # Will be overridden by probe defaults based on network detection

  # SSL Configuration with Dynamic Defaults
  - id: ssl_configuration
    type: select
    message: "SSL Configuration:"
    instruction: "HTTPS encryption for secure access"
    choices:
      - "Generate Let's Encrypt certificate (Recommended)"
      - "Use existing certificate files"
      - "No SSL (HTTP only - Development)"
    # Dynamic defaults based on environment
    dynamic_defaults:
      - condition: "environment_type == 'Development (Local testing)'"
        value: "No SSL (HTTP only - Development)"
        reason: "Development environment doesn't require SSL"
      - condition: "environment_type == 'Production (Live deployment)'"
        value: "Generate Let's Encrypt certificate (Recommended)"
        reason: "Production requires SSL for security"
      - condition: "environment_type == 'Staging (Pre-production testing)'"
        value: "Generate Let's Encrypt certificate (Recommended)"
        reason: "Staging should match production SSL setup"
    # Static fallback
    default: "Generate Let's Encrypt certificate (Recommended)"

  # Resource Configuration
  - id: memory_limit
    type: select
    message: "Memory limit for OpenProject:"
    instruction: "Based on expected usage and available system memory"
    choices:
      - "1GB (Development)"
      - "2GB (Small teams, <20 users)"
      - "4GB (Medium teams, 20-100 users)"
      - "8GB (Large teams, >100 users)"
      - "16GB (Enterprise, >500 users)"
    default: "2GB (Small teams, <20 users)"
    # Will be overridden by probe defaults based on detected system memory

  - id: worker_processes
    type: select
    message: "Number of worker processes:"
    instruction: "More workers handle more concurrent users"
    choices:
      - "1 (Minimal)"
      - "2 (Light usage)"
      - "4 (Medium usage)"
      - "8 (High usage)"
      - "16 (Enterprise)"
    default: "2 (Light usage)"
    # Will be overridden by probe defaults based on detected CPU cores

  # Final Summary
  - id: configuration_summary
    type: info
    title: "Configuration Summary"
    message: |
      Configuration collection complete!
      
      Your OpenProject instance will be configured with:
      • Project: {{project_name}}
      • Environment: {{environment_type}}
      • Database: {{database_type}} ({{database_setup}})
      • Domain: {{domain_name}}
      • SSL: {{ssl_configuration}}
      • Memory: {{memory_limit}}
      
      The configuration will be validated and prepared for deployment.
    instruction: "Press Enter to continue"