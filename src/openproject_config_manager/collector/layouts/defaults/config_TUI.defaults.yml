# Filename: config_TUI.defaults.yml

metadata:
  generated_at: "2025-10-12T15:45:00Z"
  probe_version: "1.0.0"
  layout_file: "config_tui.layout.yml"
  
  # System information detected during probe
  system_info:
    os: "Ubuntu 22.04.3 LTS"
    arch: "x86_64"
    hostname: "openproject-server"
    memory_total_gb: 16
    memory_available_gb: 14
    cpu_cores: 8
    cpu_model: "Intel(R) Xeon(R) CPU E5-2686 v4"
    docker_version: "24.0.7"
    docker_compose_version: "2.21.0"
    
  # Network detection results
  network_info:
    public_ip: "203.0.113.42"
    private_ip: "10.0.1.15"
    available_ports: [80, 443, 8080, 3000, 5432]
    blocked_ports: [22, 25, 135, 139, 445]
    domain_detected: false
    reverse_dns: null
    interfaces: ["eth0", "docker0", "lo"]
    
  # Service detection results  
  services_info:
    postgresql_detected: false
    mysql_detected: false
    nginx_detected: true
    apache_detected: false
    ssl_certificates: []
    existing_containers: ["nginx-proxy", "letsencrypt-companion"]
    
  # Storage analysis
  storage_info:
    root_filesystem: "/dev/sda1"
    total_space_gb: 500
    available_space_gb: 420
    recommended_data_path: "/opt/openproject/data"
    backup_space_available: true

# Probe-based defaults that override layout.yml static defaults
defaults:
  # Domain configuration based on network detection
  domain_name:
    value: "openproject.local"
    reason: "No public domain detected, using local domain for development"
    probe_source: "network.domain_detection"
    confidence: "medium"
    
  # Memory allocation based on detected system resources  
  memory_limit:
    value: "4GB (Medium teams, 20-100 users)"
    reason: "Detected 16GB system RAM, recommending 25% allocation (4GB)"
    probe_source: "system.memory_analysis"
    confidence: "high"
    
  # Worker processes based on CPU detection
  worker_processes:
    value: "4 (Medium usage)"
    reason: "Detected 8 CPU cores, recommending 50% allocation for optimal performance"
    probe_source: "system.cpu_analysis" 
    confidence: "high"
    
  # Port configuration based on availability scan
  http_port:
    value: "80"
    reason: "Port 80 is available and no conflicting web server detected"
    probe_source: "network.port_availability"
    confidence: "high"
    
  https_port:
    value: "443"
    reason: "Port 443 is available, SSL recommended for this configuration"
    probe_source: "network.port_availability"
    confidence: "high"
    
  # Database setup recommendation based on service detection
  database_setup:
    value: "container"
    reason: "No existing PostgreSQL or MySQL detected, containerized setup recommended"
    probe_source: "services.database_scan"
    confidence: "high"
    
  # SSL configuration based on environment analysis
  ssl_configuration:
    value: "Generate Let's Encrypt certificate (Recommended)"
    reason: "Public IP detected (203.0.113.42), SSL certificate recommended for security"
    probe_source: "network.public_ip_detection"
    confidence: "medium"
    
  # Project name suggestion based on hostname
  project_name:
    value: "openproject-server"
    reason: "Based on detected hostname, can be customized as needed"
    probe_source: "system.hostname"
    confidence: "low"

# Conditional defaults applied based on detected system characteristics  
conditional_defaults:
  # High-resource system optimizations
  - condition: "system.memory_total_gb >= 32 && system.cpu_cores >= 16"
    description: "High-resource system detected"
    defaults:
      memory_limit: "8GB (Large teams, >100 users)"
      worker_processes: "8 (High usage)"
      enable_metrics: true
      log_level: "INFO"
      
  # Low-resource system constraints
  - condition: "system.memory_total_gb <= 4"
    description: "Limited memory system detected"
    defaults:
      memory_limit: "1GB (Development)"
      worker_processes: "1 (Minimal)"
      enable_metrics: false
      log_level: "ERROR"
      
  # Cloud environment detection (based on common cloud metadata endpoints)
  - condition: "network.cloud_provider != null"
    description: "Cloud environment detected"
    defaults:
      backup_frequency: "daily"
      enable_metrics: true
      ssl_configuration: "Generate Let's Encrypt certificate (Recommended)"
      
  # Development environment indicators
  - condition: "system.hostname contains 'dev' || system.hostname contains 'test'"
    description: "Development environment detected from hostname"
    defaults:
      environment_type: "Development (Local testing)"
      ssl_configuration: "No SSL (HTTP only - Development)"
      log_level: "DEBUG"
      enable_backups: false
      
  # Production environment indicators  
  - condition: "network.public_ip != null && system.memory_total_gb >= 8"
    description: "Production-like environment detected"
    defaults:
      environment_type: "Production (Live deployment)"
      ssl_configuration: "Generate Let's Encrypt certificate (Recommended)"
      enable_backups: true
      backup_frequency: "daily"
      log_level: "INFO"

# Warnings and recommendations based on probe results
recommendations:
  - condition: "system.memory_total_gb < 4"
    type: "warning"
    message: "System has limited memory ({{system.memory_total_gb}}GB). Consider upgrading for production use."
    
  - condition: "!network.public_ip && ssl_configuration == 'Generate Let\\'s Encrypt certificate'"
    type: "info"
    message: "No public IP detected. Let's Encrypt requires a public domain. Consider 'No SSL' for local development."
    
  - condition: "services.nginx_detected && http_port == '80'"
    type: "warning"
    message: "Existing Nginx detected on port 80. May need to configure reverse proxy or use different port."
    
  - condition: "storage.available_space_gb < 50"
    type: "warning"
    message: "Low disk space detected ({{storage.available_space_gb}}GB available). Ensure adequate space for OpenProject data."