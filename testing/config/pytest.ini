[tool:pytest]
minversion = 6.0
addopts = 
    -ra 
    --strict-markers 
    --strict-config 
    --disable-warnings
    --tb=short
testpaths = ../unit ../integration ../e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    ui: UI component tests
    e2e: End-to-end workflow tests
    integration: Integration tests
    slow: Slow running tests
    unit: Fast unit tests

# Test discovery patterns
collect_ignore = ["setup.py"]

# Coverage settings
[coverage:run]
source = src/openproject_config_manager
omit = 
    */testing/*
    */test_*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod