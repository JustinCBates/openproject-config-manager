flow_id: openproject_main_config
title: OpenProject Configuration
description: Configure your OpenProject instance step by step
icon: 🏗️

steps:
  # Project Basics
  - id: project_name
    type: text
    message: "Project name:"
    instruction: "This will be used as the container and volume prefix"
    validate: required
    default: "openproject"

  - id: admin_email
    type: text
    message: "Administrator email:"
    instruction: "Email for the OpenProject admin account"
    validate: email

  # Database Configuration
  - id: database_type
    type: select
    message: "Database type:"
    choices:
      - name: "PostgreSQL (Recommended)"
        value: "postgresql"
      - name: "MySQL"
        value: "mysql"
    default: "postgresql"

  - id: database_host
    type: text
    message: "Database host:"
    instruction: "Database server hostname or IP"
    default: "localhost"
    validate: required

  - id: database_port
    type: text
    message: "Database port:"
    instruction: "Database server port"
    default: "5432"
    validate: integer

  - id: database_name
    type: text
    message: "Database name:"
    instruction: "Name of the OpenProject database"
    default: "openproject"
    validate: required

  - id: database_username
    type: text
    message: "Database username:"
    instruction: "Database user for OpenProject"
    default: "openproject"
    validate: required

  - id: database_password
    type: password
    message: "Database password:"
    instruction: "Password for the database user"
    validate: password_length

  # Network Configuration
  - id: domain
    type: text
    message: "Domain name:"
    instruction: "Domain where OpenProject will be accessible (e.g., openproject.example.com)"
    validate: required

  - id: ssl_enabled
    type: confirm
    message: "Enable SSL/HTTPS?"
    instruction: "Recommended for production deployments"
    default: true

  - id: http_port
    type: text
    message: "HTTP port:"
    instruction: "Port for HTTP traffic"
    default: "80"
    validate: integer
    condition: "ssl_enabled == false"

  - id: https_port
    type: text
    message: "HTTPS port:"
    instruction: "Port for HTTPS traffic"
    default: "443"
    validate: integer
    condition: "ssl_enabled == true"

  # Email Configuration
  - id: email_delivery_method
    type: select
    message: "Email delivery method:"
    choices:
      - name: "SMTP"
        value: "smtp"
      - name: "Sendmail"
        value: "sendmail"
      - name: "None (Disable email)"
        value: "none"
    default: "smtp"

  - id: smtp_host
    type: text
    message: "SMTP host:"
    instruction: "SMTP server hostname"
    validate: required
    condition: "email_delivery_method == smtp"

  - id: smtp_port
    type: text
    message: "SMTP port:"
    instruction: "SMTP server port (usually 587 or 465)"
    default: "587"
    validate: integer
    condition: "email_delivery_method == smtp"

  - id: smtp_username
    type: text
    message: "SMTP username:"
    instruction: "Username for SMTP authentication"
    condition: "email_delivery_method == smtp"

  - id: smtp_password
    type: password
    message: "SMTP password:"
    instruction: "Password for SMTP authentication"
    condition: "email_delivery_method == smtp"

  # Storage Configuration
  - id: enable_attachments
    type: confirm
    message: "Enable file attachments?"
    instruction: "Allow users to upload files"
    default: true

  - id: attachment_max_size
    type: text
    message: "Maximum attachment size (MB):"
    instruction: "Maximum file size for attachments"
    default: "50"
    validate: integer
    condition: "enable_attachments == true"

  # Advanced Configuration
  - id: enable_git_repositories
    type: confirm
    message: "Enable Git repositories?"
    instruction: "Allow Git repository integration"
    default: false

  - id: enable_subversion
    type: confirm
    message: "Enable Subversion repositories?"
    instruction: "Allow SVN repository integration"
    default: false

  # Resource Limits
  - id: memory_limit
    type: select
    message: "Memory limit for OpenProject container:"
    choices:
      - name: "2GB (Minimum)"
        value: "2g"
      - name: "4GB (Recommended)"
        value: "4g"
      - name: "8GB (Large instances)"
        value: "8g"
      - name: "16GB (Enterprise)"
        value: "16g"
    default: "4g"

output_mapping:
  project:
    name: project_name
  admin:
    email: admin_email
  database:
    type: database_type
    host: database_host
    port: database_port
    name: database_name
    username: database_username
    password: database_password
  network:
    domain: domain
    ssl_enabled: ssl_enabled
    http_port: http_port
    https_port: https_port
  email:
    delivery_method: email_delivery_method
    smtp:
      host: smtp_host
      port: smtp_port
      username: smtp_username
      password: smtp_password
  storage:
    attachments_enabled: enable_attachments
    attachment_max_size: attachment_max_size
  repositories:
    git_enabled: enable_git_repositories
    svn_enabled: enable_subversion
  resources:
    memory_limit: memory_limit