component:
  name: config-manager
  description: OpenProject configuration management component
  version: 1.0.0
  entry_script: run_phases.py
  entry_script_location: Repository root
  usage: python3 run_phases.py --start 1 --end 5
  main_orchestrator:
    file: phases/phases_orchestrator.py
    class: PhasesOrchestrator
    description: Main orchestrator coordinating all 5 phases
    methods:
    - execute_all_phases(context) -> Dict[str, Any]
    - execute_phase(phase_number, context) -> Dict[str, Any]
    - execute_phases_range(start, end, context) -> Dict[str, Any]
entry_points:
  cli:
    status: IMPLEMENTED
    description: Main CLI entry point
    calls:
    - configure
    - update
    - validate
    - discover
    - export
    - version
  configure:
    status: IMPLEMENTED
    description: Run complete configuration process
    flow_id: main_config_flow
  update:
    status: PLANNED
    description: Update existing configuration
    flow_id: update_flow
  validate:
    status: IMPLEMENTED
    description: Validate configuration file
    flow_id: validation_flow
  discover:
    status: IMPLEMENTED
    description: Run discovery only
    flow_id: discovery_flow
  export:
    status: IMPLEMENTED
    description: Export configuration
    flow_id: export_flow
flows:
  main_config_flow:
    description: Primary Configuration Process
    orchestrator: phases/phases_orchestrator.py::PhasesOrchestrator
    phases:
    - phase_id: discovery
      name: Discovery Phase
      status: IMPLEMENTED
      description: Discover system environment and generate intelligent defaults
      sub_flows:
      - discovery_flow
      artifacts_produced:
      - discovery_data
      - enhanced_defaults_file
      artifacts_consumed: []
      implementation:
        phase_directory: phases/phase_1_discovery/
        orchestrator_file: phases/phase_1_discovery/orchestrator_discovery.py
        module: phases.phase_1_discovery
        class: DiscoveryPhase
        method: execute(context)
        returns: Dict[str, Any] with discovery_data and enhanced_defaults_file
        dependencies:
        - phases/phase_1_discovery/step_1_env_discovery/environment.py
        - phases/phase_1_discovery/step_2_system_discovery/system.py
        - phases/phase_1_discovery/step_2_system_discovery/docker.py
        - phases/phase_1_discovery/step_2_system_discovery/network.py
        - phases/phase_1_discovery/step_3_defaults_generation/defaults_generator.py
        side_effects:
        - action: writes
          artifact: enhanced_defaults_file
          location: phases/phase_1_discovery/outputs/discovery/enhanced_defaults.yml
          transformation: DefaultsGenerator.generate_enhanced_defaults()
      data_flow:
        input: []
        processing: "System probing \u2192 in-memory dict \u2192 YAML serialization"
        output_memory:
        - discovery_data
        output_file:
        - enhanced_defaults_file
      sequence: 1
    - phase_id: tui_mapping
      name: TUI Defaults Mapping
      status: IMPLEMENTED
      description: Transform rich enhanced defaults to simple TUI format
      sub_flows:
      - tui_mapping_flow
      artifacts_produced:
      - tui_defaults_file
      artifacts_consumed:
      - enhanced_defaults_file
      - defaults_mapping_config
      implementation:
        phase_directory: phases/phase_2_tui_mapping/
        orchestrator_file: phases/phase_2_tui_mapping/orchestrator_tui_mapping.py
        module: phases.phase_2_tui_mapping
        class: TuiMappingPhase
        method: execute(context)
        returns: Dict[str, Any] with tui_defaults_file path
        dependencies:
        - phases/phase_2_tui_mapping/step_1_transform_defaults/defaults_transformer.py
        - artifact: defaults_mapping_config
          type: REFERENCE_DATA
          location: src/openproject_config_manager/core/defaults_map.json
          purpose: "Defines field mappings from enhanced \u2192 TUI format"
        side_effects:
        - action: reads
          artifact: enhanced_defaults_file
          location: phases/phase_1_discovery/outputs/discovery/enhanced_defaults.yml
          method: yaml.safe_load()
        - action: reads
          artifact: defaults_mapping_config
          location: src/openproject_config_manager/core/defaults_map.json
          method: json.load()
        - action: writes
          artifact: tui_defaults_file
          location: phases/phase_2_tui_mapping/outputs/tui/tui_defaults.yml
          transformation: DefaultsTransformer.transform_enhanced_defaults()
      data_flow:
        input_file:
        - enhanced_defaults_file
        - defaults_mapping_config
        processing: "Load YAML files \u2192 apply field mapping \u2192 flatten {value}\
          \ fields \u2192 write simple YAML"
        output_file:
        - tui_defaults_file
      sequence: 2
    - phase_id: collection
      name: Interactive Collection
      status: IMPLEMENTED
      description: Collect user configuration via interactive UI
      sub_flows:
      - collection_flow
      artifacts_produced:
      - user_configuration
      artifacts_consumed:
      - tui_defaults_file
      implementation:
        phase_directory: phases/phase_3_collection/
        orchestrator_file: phases/phase_3_collection/orchestrator_collection.py
        module: phases.phase_3_collection
        class: CollectionPhase
        method: execute(context)
        note: Uses tui-form-engine library for interactive forms. Supports mock responses
          for testing.
        dependencies:
        - phases/phase_3_collection/step_1_collect_user_configuration/tui_collector.py
        - phases/phase_3_collection/step_1_collect_user_configuration/layouts/config_tui.layout.yml
        - 'external library: tui-form-designer (optional - can use mock responses)'
        side_effects:
        - action: reads
          artifact: tui_defaults_file
          location: phases/phase_2_tui_mapping/outputs/tui/tui_defaults.yml
        - action: writes
          artifact: user_configuration
          location: phases/phase_3_collection/outputs/collected_configuration.yml
        - action: writes
          artifact: user_responses
          location: phases/phase_3_collection/outputs/config_tui.layout_responses.json
          note: Raw JSON responses for debugging
      sequence: 3
    - phase_id: validation
      name: Validation Phase
      status: IMPLEMENTED
      description: Validate collected configuration
      sub_flows:
      - validation_flow
      artifacts_produced:
      - validated_configuration
      - validation_report
      artifacts_consumed:
      - user_configuration
      implementation:
        phase_directory: phases/phase_4_validation/
        orchestrator_file: phases/phase_4_validation/orchestrator_validation.py
        module: phases.phase_4_validation
        class: ValidationPhase
        method: execute(context)
        dependencies:
        - phases/phase_4_validation/step_1_schema_validation/schema_validator.py
        - phases/phase_4_validation/step_2_dependency_validation/dependency_validator.py
        - phases/phase_4_validation/step_3_environment_validation/environment_validator.py
        side_effects:
        - action: reads
          artifact: user_configuration
          location: phases/phase_3_collection/outputs/collected_configuration.yml
        - action: writes
          artifact: validation_report
          location: phases/outputs/validation_report.yml
      sequence: 4
    - phase_id: export
      name: Export Phase
      status: IMPLEMENTED
      description: Export final configuration files for deployment
      artifacts_produced:
      - final_configuration_files
      artifacts_consumed:
      - validated_configuration
      implementation:
        phase_directory: phases/phase_5_export/
        orchestrator_file: phases/phase_5_export/orchestrator_export.py
        module: phases.phase_5_export
        class: ExportPhase
        method: execute(context)
        note: Outputs to phases/outputs/ for deploy-manager consumption
        dependencies:
        - phases/phase_5_export/cfg_writer.py
        side_effects:
        - action: reads
          artifact: validated_configuration
          location: phases/outputs/validation_report.yml
        - action: writes
          artifact: docker-compose.yml
          location: phases/outputs/docker-compose.yml
          note: Final deployment file for deploy-manager
        - action: writes
          artifact: .env
          location: phases/outputs/.env
          note: Environment configuration for deploy-manager
        - action: writes
          artifact: configuration_manifest.yml
          location: phases/outputs/configuration_manifest.yml
          note: Metadata and manifest for deploy-manager
      sequence: 5
  discovery_flow:
    description: System Discovery Process
    steps:
    - step_id: env_discovery
      name: Environment Discovery
      status: IMPLEMENTED
      description: Detect Docker, system capabilities, network configuration
    - step_id: system_discovery
      name: System Discovery
      status: IMPLEMENTED
      description: Analyze system resources, ports, services
    - step_id: defaults_generation
      name: Intelligent Defaults Generation
      status: IMPLEMENTED
      description: Generate enhanced defaults based on discovery data
  validation_flow:
    description: Configuration Validation Process
    steps:
    - step_id: schema_validation
      name: Schema Validation
      status: IMPLEMENTED
      description: Validate against configuration schema
    - step_id: dependency_validation
      name: Dependency Validation
      status: IMPLEMENTED
      description: Check for conflicts and dependencies
    - step_id: environment_validation
      name: Environment Validation
      status: IMPLEMENTED
      description: Validate against current environment constraints
  tui_mapping_flow:
    description: TUI Defaults Mapping Process
    steps:
    - step_id: transform_defaults
      name: Transform Defaults to TUI Format
      status: IMPLEMENTED
      description: Load enhanced defaults and mapping config, apply transformations,
        write TUI defaults file
  collection_flow:
    description: Interactive Configuration Collection Process
    steps:
    - step_id: collect_user_configuration
      name: Collect User Configuration
      status: IMPLEMENTED
      description: Load TUI layout and defaults, render interactive form, collect
        user input, save configuration
artifacts:
  discovery_data:
    description: Raw discovery data from environment scanning
    format: JSON
    state: IN_MEMORY
    persistence: TRANSIENT
    location: Python dict returned from run_discovery_phase()
    produced_by: discovery phase
    consumed_by: []
    note: Transformed to enhanced_defaults_file via YAML serialization
  enhanced_defaults_file:
    description: Rich defaults with discovery data and recommendations
    format: YAML
    state: FILE
    persistence: PERSISTENT
    location: output/discovery/discovery_output.yml
    source_artifact: discovery_data
    transformation: dict_to_yaml_with_metadata
    produced_by: discovery phase
    consumed_by:
    - tui_mapping phase
    structure:
      metadata:
        description: System probe information
        fields:
        - generated_at
        - probe_version
        - layout_file
        - system_info
        - network_info
        - services_info
        - storage_info
      defaults:
        description: Intelligent defaults with discovery data
        fields:
        - domain
        - port
        - memory_limit
        - database_setup
        - ssl_configuration
        format: Each field has {value, source, confidence, reason} structure
  defaults_mapping_config:
    description: "Field mapping rules for enhanced \u2192 TUI transformation"
    format: YAML
    state: FILE
    persistence: STATIC
    role: REFERENCE_DATA
    location: outputs/mapping/field_mapping_config.yml
    used_by:
    - tui_mapping phase
    note: Maps enhanced defaults fields to TUI defaults keys with source paths (currently
      mocked, will be externalized)
    structure:
      field_mappings:
        description: Mapping rules for each field
        example: "\"domain\": {\n  \"source_path\": \"defaults.domain.value\",\n \
          \ \"target_key\": \"domain\",\n  \"fallback\": \"localhost\"\n}\n"
      output_format:
        description: Output file formatting rules
        fields:
        - header_comments
  tui_defaults_file:
    description: Simplified defaults for TUI display
    format: YAML
    state: FILE
    persistence: PERSISTENT
    location: outputs/tui/tui_defaults.yml
    final_location: src/openproject_config_manager/collector/layouts/defaults/config_tui.defaults.yml
    source_artifact: enhanced_defaults_file
    transformation: field_mapping_with_flattening
    produced_by: tui_mapping phase
    consumed_by:
    - collection phase
    note: Generated in phase outputs, then copied to final_location for TUI consumption
    structure:
      defaults:
        description: Flat key-value pairs for TUI consumption
        format: Simple string values extracted from enhanced defaults {value} field
  user_configuration:
    description: Configuration collected from user via TUI
    format: YAML
    state: FILE
    persistence: PERSISTENT
    location: output/collected_configuration.yml
    produced_by: collection phase
    consumed_by:
    - validation phase
  validated_configuration:
    description: User configuration after validation
    format: YAML
    state: IN_MEMORY
    persistence: TRANSIENT
    produced_by: validation phase
    consumed_by:
    - export phase
  validation_report:
    description: Validation results and any issues found
    format: JSON
    state: IN_MEMORY
    persistence: TRANSIENT
    produced_by: validation phase
    consumed_by: []
  final_configuration_files:
    description: Final exported configuration files
    format: Multiple (docker-compose.yml, .env, etc.)
    state: FILE
    persistence: PERSISTENT
    location: output/exported/
    produced_by: export phase
    consumed_by: []
transformations:
  discovery_to_enhanced_file:
    name: Discovery Data to Enhanced Defaults File
    from: discovery_data
    to: enhanced_defaults_file
    method: "_generate_enhanced_defaults() \u2192 _write_enhanced_defaults_file()"
    location: ConfigurationManager class
    logic: '1. Extract system, network, docker, environment data from discovery_data

      2. Build metadata section with probe info and system details

      3. Generate intelligent defaults with {value, source, confidence, reason} structure

      4. Serialize to YAML file at output/discovery/discovery_output.yml

      '
    input_state: IN_MEMORY
    output_state: FILE
  enhanced_file_to_tui_file:
    name: Enhanced Defaults to TUI Defaults
    from: enhanced_defaults_file
    to: tui_defaults_file
    method: "_load_enhanced_defaults_file() \u2192 _apply_field_mapping() \u2192 _write_tui_defaults_file()"
    uses_reference:
    - defaults_mapping_config
    location: ConfigurationManager class
    logic: "1. Load enhanced defaults YAML from file\n2. Load field mapping rules\
      \ (hardcoded config)\n3. For each mapping rule:\n   - Extract value from source_path\
      \ (e.g., \"defaults.domain.value\")\n   - Map to target_key with fallback if\
      \ missing\n4. Flatten to simple key: \"value\" pairs\n5. Write to TUI defaults\
      \ file with header comments\n"
    input_state: FILE
    output_state: FILE
    transformation_type: FIELD_MAPPING_WITH_FLATTENING
decision_points:
  continue_on_validation_failure:
    description: Whether to continue if validation finds non-critical issues
    options:
    - continue
    - abort
    - fix_and_retry
    default: fix_and_retry
  skip_discovery:
    description: Whether to skip discovery if existing defaults found
    options:
    - skip
    - refresh
    - merge
    default: merge
implementation_status:
  overall: IMPLEMENTED
  last_updated: '2025-10-13'
  notes: Core configuration flow fully implemented and tested
