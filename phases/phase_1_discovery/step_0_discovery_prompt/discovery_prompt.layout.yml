layout_id: discovery_prompt
title: "Discovery Configuration Prompt"
icon: "🔧"
description: "Ask user whether to use automatic system discovery or manual configuration"

metadata:
  id: discovery_prompt
  version: "1.0.0"
  estimated_time: "30 seconds"

steps:
  - id: discovery_mode
    type: select
    message: "Choose discovery mode:"
    instruction: "Select how you want to configure your OpenProject deployment"
    choices:
      - value: auto
        label: "Automatic - Discover system configuration automatically"
        description: "Scan Docker containers, network, and system to auto-detect settings"
      - value: manual
        label: "Manual - I'll provide configuration manually"
        description: "Enter all configuration values manually through prompts"
    default: "auto"
