title: OpenProject Configuration
description: Configure your OpenProject deployment with modular sublayouts
icon: "\U0001F3D7\uFE0F"
version: 1.0.0
metadata:
  version: 2.0.0
  type: modular
  components: 7
  maintainer: OpenProject Config Manager
  created: '2024'
  description: Modular configuration layout for improved maintainability
defaults_file: /opt/openproject/external/config-manager/phases/phase_3_collection/outputs/unified_defaults.yml
steps:
- id: welcome
  type: info
  title: Welcome to OpenProject Setup
  message: "This wizard will guide you through configuring your OpenProject instance.\n\
    \nWe'll collect information about:\n\u2022 Project settings and admin account\n\
    \u2022 Database configuration  \n\u2022 Network and domain setup\n\u2022 Email\
    \ delivery settings\n\u2022 Storage and repository options\n\u2022 Resource allocation\n\
    \nAll settings can be changed later if needed.\n"
  instruction: Press Enter to continue
- id: project_name
  type: text
  message: 'Project name:'
  instruction: Used for container names, volumes, and internal references
  validate: required
  default: openproject
  pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
  error_message: Must start with letter, contain only letters, numbers, underscores,
    and hyphens
- id: admin_email
  type: text
  message: 'Administrator email address:'
  instruction: Email for the primary OpenProject administrator account
  validate: email
  error_message: Please enter a valid email address
- id: admin_password
  type: password
  message: 'Administrator password:'
  instruction: Strong password for the admin account (min 8 characters)
  validate: password_length
  min_length: 8
- id: environment
  type: select
  message: 'Select deployment environment:'
  instruction: Choose the appropriate environment for this OpenProject instance
  choices:
  - development
  - staging
  - production
  default: production
- id: postgres_db
  type: text
  message: 'PostgreSQL database name:'
  instruction: Name of the database for OpenProject
  validate: required
  default: openproject_db
- id: postgres_user
  type: text
  message: 'PostgreSQL username:'
  instruction: Database user for OpenProject access
  validate: required
  default: openproject_user
- id: postgres_password
  type: password
  message: 'PostgreSQL password:'
  instruction: Strong password for the database user
  validate: password_length
  min_length: 8
- id: domain
  type: text
  message: 'Domain/hostname:'
  instruction: Domain name or IP address for accessing OpenProject
  validate: required
  default: localhost
- id: port
  type: text
  message: 'HTTP port:'
  instruction: Port for web access
  validate: port
  default: '8080'
  pattern: ^[0-9]+$
  error_message: Must be a valid port number
- id: memory_limit
  type: select
  message: 'Memory limit for OpenProject container:'
  instruction: Select appropriate memory allocation based on expected usage
  choices:
  - 1GB
  - 2GB
  - 4GB
  - 8GB
  default: 2GB
- id: backup_retention
  type: text
  message: 'Backup retention (days):'
  instruction: Number of days to keep backup files
  validate: number
  default: '7'
  pattern: ^[0-9]+$
  error_message: Must be a positive number
- id: confirm_config
  type: confirm
  message: Proceed with this configuration?
  instruction: Review the settings above and confirm to continue with deployment
  default: true
