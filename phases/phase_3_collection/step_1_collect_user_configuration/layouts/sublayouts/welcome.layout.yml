# Welcome sublayout
title: "Welcome to OpenProject Setup"
description: "Introduction and overview of the configuration process"

steps:
  - id: welcome
    type: info
    title: "Welcome to OpenProject Setup"
    message: |
      This wizard will guide you through configuring your OpenProject instance.
      
      We'll collect information about:
      • Project settings and admin account
      • Database configuration  
      • Network and domain setup
      • Email delivery settings
      • Storage and repository options
